spring:
  application:
    name: Servu
  datasource:
    url: jdbc:postgresql://localhost:5432/servu
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080
  servlet:
    session:
      timeout: 8h

servu:
  admin:
    email: ${SERVU_ADMIN_EMAIL:}
    password: ${SERVU_ADMIN_PASSWORD:}
    display-name: ${SERVU_ADMIN_DISPLAY_NAME:Platform Admin}
